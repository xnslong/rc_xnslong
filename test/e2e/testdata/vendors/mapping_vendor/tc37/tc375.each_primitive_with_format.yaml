event_type: "tc375.each_primitive_with_format"
request:
  method: POST
  path: "/api/notify"
  headers:
    Content-Type: "application/json"
  body:
    type: mapping
    template:
      items_mapped:
        $source: "@{payload:timestamps}"
        $each:
          date:
            $source: "@{item}"
            $format: "2006-01-02"
