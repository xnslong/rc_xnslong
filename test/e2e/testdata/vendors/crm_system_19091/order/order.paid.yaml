event_type: "order.paid"
request:
  method: POST
  path: "/api/notify"
  headers:
    Content-Type: "application/json"
  body:
    type: mapping
    template:
      order_id: "@{payload:order_id}"
      user_id: "@{payload:user_id}"
      amount: "@{payload:amount}"
      currency: "@{payload:currency}"
