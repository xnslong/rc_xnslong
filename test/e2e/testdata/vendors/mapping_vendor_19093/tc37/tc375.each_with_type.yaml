event_type: "tc375.each_with_type"
request:
  method: POST
  path: "/api/notify"
  headers:
    Content-Type: "application/json"
  body:
    type: mapping
    template:
      items_mapped:
        $source: "@{payload:items}"
        $each:
          price:
            $source: "@{item:price}"
            $type: number
          count:
            $source: "@{item:count}"
            $type: integer
