event_type: "tc375.each_with_format"
description: "TC3.7-each_with_format: $each with $format"
version: 1
schema:
  type: object
  properties:
    orders:
      type: array
      description: "订单列表"
      items:
        type: object
        properties:
          date:
            type: integer
            x-format: unix_s
            description: "Unix 时间戳，映射中格式化为日期字符串"
          total:
            type: number
            description: "订单总金额"
