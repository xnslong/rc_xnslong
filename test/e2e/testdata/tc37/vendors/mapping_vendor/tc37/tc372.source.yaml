event_type: "tc372.source"
request:
  method: POST
  path: "/api/notify"
  headers:
    Content-Type: "application/json"
  body:
    type: mapping
    template:
      count:
        $source: "@{payload:count}"
      active:
        $source: "@{payload:active}"
      note:
        $source: "@{payload:note}"
      prefixed:
        $source: "id_@{payload:id}"
