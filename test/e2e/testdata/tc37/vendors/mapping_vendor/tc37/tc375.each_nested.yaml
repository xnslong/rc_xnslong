event_type: "tc375.each_nested"
request:
  method: POST
  path: "/api/notify"
  headers:
    Content-Type: "application/json"
  body:
    type: mapping
    template:
      orders_mapped:
        $source: "@{payload:orders}"
        $each:
          order_id: "@{item:id}"
          products:
            $source: "@{item:items}"
            $each:
              product_name: "@{item:name}"
              cost: "@{item:price}"
