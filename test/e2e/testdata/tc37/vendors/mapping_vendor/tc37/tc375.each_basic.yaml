event_type: "tc375.each_basic"
request:
  method: POST
  path: "/api/notify"
  headers:
    Content-Type: "application/json"
  body:
    type: mapping
    template:
      products_mapped:
        $source: "@{payload:products}"
        $each:
          product_id: "@{item:id}"
          quantity: "@{item:qty}"
