event_type: "tc373.type"
request:
  body:
    type: mapping
    template:
      as_string:
        $source: "@{payload:count}"
        $type: string
      as_int:
        $source: "@{payload:count_str}"
        $type: integer
      as_number:
        $source: "@{payload:price}"
        $type: number
      as_bool:
        $source: "@{payload:flag}"
        $type: boolean
