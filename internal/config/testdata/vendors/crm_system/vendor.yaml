vendor_id: "crm_system"
request:
  method: PATCH
  url: "https://crm.company.com/api/v3/contacts/@{payload.user_id}"
  headers:
    Content-Type: "application/json"
    Authorization: "Bearer crm_api_token_xxx"
  body:
    type: mapping
retry_policy:
  max_attempts: 5
  base_delay: 10s
  max_delay: 300s
  multiplier: 2.0
  jitter: 0.2
response_judgment:
  success:
    type: http_status
